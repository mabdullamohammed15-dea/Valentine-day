<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Valentine 💖</title>
<style>
  :root{
    --pink:#ff4d6d;
    --bg1:#ff9a9e;
    --bg2:#fad0c4;
  }
  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    padding:20px;
    box-sizing:border-box;
  }
  .card{
    background:#fff;
    width:100%;
    max-width:400px;
    border-radius:18px;
    padding:28px;
    box-shadow:0 12px 30px rgba(0,0,0,0.18);
    text-align:center;
    position:relative; /* anchor for absolute children */
    overflow:hidden;
  }
  .title{
    color:var(--pink);
    margin:0 0 16px 0;
    font-size:20px;
    line-height:1.25;
  }
  .controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:14px;
  }
  .name-input{
    padding:8px 10px;
    border-radius:12px;
    border:1px solid #eee;
    font-size:14px;
    width:160px;
  }
  .buttons{
    position:relative;
    height:120px; /* reserve space for playful movement */
  }
  button{
    border:0;
    border-radius:24px;
    padding:10px 18px;
    font-size:15px;
    cursor:pointer;
  }
  .yes{
    background:var(--pink);
    color:#fff;
    z-index:2;
    position:relative;
  }
  .no{
    background:#ddd;
    position:absolute;
    left:16px;
    top:12px;
    z-index:1;
    transition: left 0.22s ease, top 0.22s ease;
  }
  /* make the no button focus-visible for keyboard users */
  .no:focus{
    outline:3px solid rgba(255,77,109,0.28);
  }
  /* Responsive tweaks */
  @media (max-width:420px){
    .card{padding:18px}
    .buttons{height:100px}
    .name-input{width:120px}
  }
</style>
</head>
<body>
  <div class="card" role="region" aria-label="Valentine card">
    <h1 class="title">💘 <span id="recipient">yourname</span>, will you be my Valentine? 💘</h1>

    <div class="controls" aria-hidden="false">
      <input class="name-input" id="nameInput" type="text" placeholder="Type a name" aria-label="Recipient name" />
    </div>

    <div class="buttons" id="buttonArea">
      <button class="yes" id="yesBtn" type="button" aria-label="Yes, I will be your valentine">Yes ❤️</button>
      <button class="no" id="noBtn" type="button" aria-label="No, I don't want to be your valentine">No 😢</button>
    </div>
  </div>
